<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soenneker.Blazor.DataTables.Demo</title>
    <base href="%BASE_URL%" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/quark-tailwind.min.css" rel="stylesheet" />
    <script>
        (() => {
            const storageKey = "quark-theme";
            const storedTheme = localStorage.getItem(storageKey);
            const resolvedTheme = storedTheme === "dark" ? "dark" : "light";

            if (!storedTheme) {
                localStorage.setItem(storageKey, "light");
            }

            document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        })();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@3.0.0/css/dataTables.bootstrap5.min.css" integrity="sha256-AuuQ90KiUc1urBzFiGtbewZqV66X0oEnGJ8VOW0L+LM=" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@4.0.0/css/responsive.bootstrap5.min.css" integrity="sha256-RipcxJXRggRd9CZr7GGfado37ZviworxxY0ALMyhlUM=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-buttons-bs5@4.0.0/css/buttons.bootstrap5.min.css" integrity="sha256-8K96PzAx2csmnvWHSOqoIiroc6P1TGOLZ2HVdQbwl/M=" crossorigin="anonymous">

    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha256-rMfkFFWoB2W1/Zx+4bgHim0WC7vKRVrq6FTeZclH1Z4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@3.0.0/js/dataTables.min.js" integrity="sha256-B5BhfFbxJ22Y2kW2n7OwbHmOKZR49jt+Kaf4JA7ABME=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@3.0.0/js/dataTables.bootstrap5.min.js" integrity="sha256-GAYCJYJXam7ooZIogdJsk56F58mZYq4oercp6aR5ajM=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/datatables.net-buttons@4.0.0/js/dataTables.buttons.min.js" integrity="sha256-YvO5tpSuVtbb+Ealp59QU/5EXY96BHbRfgAUcVk8a/w=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-buttons-bs5@4.0.0/js/buttons.bootstrap5.min.js" integrity="sha256-GlmymnodEMR+3CI/T65FnaNTVN73u2klmrfKjCgrRxc=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive@4.0.0/js/dataTables.responsive.min.js" integrity="sha256-annZIJj2TgK2Yf7o4Xeq6rpxxSB63wX/AEvzOAjfUkA=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@4.0.0/js/responsive.bootstrap5.min.js" integrity="sha256-Q3ZM6WB2kjKBiaO8x1M+/fc2OSaHOwZR7Ziu81/gCT0=" crossorigin="anonymous"></script>
</body>

</html>
